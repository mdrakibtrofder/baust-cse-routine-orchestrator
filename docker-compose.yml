# docker-compose.yml — Backend only
services:
  backend:
    image: mdrakibtrofder/baust-cse-routine-orchestrator:latest
    container_name: baust-cse-routine-backend
    restart: always
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${APP_PORT:-3000}/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s